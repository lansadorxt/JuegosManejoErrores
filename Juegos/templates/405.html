{% extends "maestra.html" %}
{% block titulo %}Error 405 - Método No Permitido{% endblock %}
{% block contenido %}
<div class="container text-center py-5">
    <h1 class="display-1 text-info fw-bold">405</h1>
    <h2 class="mb-3">Método HTTP No Permitido</h2>
    <p class="lead">El procedimiento empleado para hacer la consulta no está permitido en este recurso.</p>
    <a href="{{ url_for('juegos') }}" class="btn btn-primary mt-3">Volver al Inicio</a>
</div>
{% endblock %}
